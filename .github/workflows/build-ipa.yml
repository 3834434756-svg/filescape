name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SCHEME: Filescape
  PRODUCT_NAME: Filescape
  PROJECT: Filescape.xcodeproj

jobs:
  build:
    # 不要用 macos-latest：它是移动标签，2026-06 已从 macOS 15 漂到 macOS 26，
    # 同一份 YAML 会毫无征兆地构建失败。锁定版本。
    runs-on: macos-15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境探测
        run: |
          echo "--- macOS ---"
          sw_vers
          echo "--- 可用 Xcode ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo "--- 默认 Xcode ---"
          xcodebuild -version || true
          echo "--- 磁盘 ---"
          df -h / | tail -1

      - name: 选择 Xcode
        run: |
          set -e
          if [ -d /Applications/Xcode_16.4.app ]; then
            PICK=/Applications/Xcode_16.4.app
          elif [ -d /Applications/Xcode_16.3.app ]; then
            PICK=/Applications/Xcode_16.3.app
          else
            PICK="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          echo "使用 $PICK"
          sudo xcode-select -s "$PICK"
          xcodebuild -version

      - name: 安装 XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 归档（未签名）
        run: |
          # pipefail 必须有：只要 xcodebuild 失败，整条管道就要失败。
          # 之前写成 `xcodebuild ... | tee log | tail -40`，退出码取的是 tail 的，
          # 编译挂了这一步还显示成功，直到下一步找不到 .app 才报错，误导排查方向。
          set -eo pipefail

          if ! xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            > "$RUNNER_TEMP/archive.log" 2>&1
          then
            echo "===== 归档失败，错误摘要 ====="
            grep -E "error:|❌|ARCHIVE FAILED" "$RUNNER_TEMP/archive.log" | head -40 || true
            echo
            echo "===== 日志末尾 80 行 ====="
            tail -80 "$RUNNER_TEMP/archive.log"
            exit 1
          fi

          echo "归档成功"
          tail -5 "$RUNNER_TEMP/archive.log"

      - name: 打包成 IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/$PRODUCT_NAME.app"
          test -d "$APP" || { echo "找不到 .app：$APP"; ls -R "$RUNNER_TEMP/App.xcarchive/Products" ; exit 1; }

          mkdir -p "$RUNNER_TEMP/Payload"
          ditto "$APP" "$RUNNER_TEMP/Payload/$PRODUCT_NAME.app"

          cd "$RUNNER_TEMP"
          # -y 必须带：.app 里的 framework 大量用符号链接，展平后装不上
          zip -qry "$PRODUCT_NAME-unsigned.ipa" Payload
          ls -lh "$PRODUCT_NAME-unsigned.ipa"

      - name: 校验产物
        run: |
          set -e
          IPA="$RUNNER_TEMP/$PRODUCT_NAME-unsigned.ipa"
          echo "--- 结构 ---"
          unzip -l "$IPA" | head -20
          echo "--- 体积 ---"
          du -h "$IPA"
          echo "--- 必须为 0 的三项（未签名特征）---"
          echo "_CodeSignature 数量: $(unzip -l "$IPA" | grep -c '_CodeSignature/' || true)"
          echo "mobileprovision 数量: $(unzip -l "$IPA" | grep -c 'embedded.mobileprovision' || true)"
          echo "--- 二进制架构 ---"
          unzip -o -q "$IPA" -d "$RUNNER_TEMP/inspect"
          file "$RUNNER_TEMP/inspect/Payload/$PRODUCT_NAME.app/$PRODUCT_NAME" || true

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ runner.temp }}/Filescape-unsigned.ipa
          retention-days: 30

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="build-${GITHUB_RUN_NUMBER}"
          # 注意：--notes 必须单行。跨行且不缩进会让 YAML 块标量提前结束，整份 workflow 解析失败。
          gh release create "$TAG" \
            "$RUNNER_TEMP/$PRODUCT_NAME-unsigned.ipa" \
            --title "Filescape $TAG" \
            --notes "由 GitHub Actions 在 macOS runner 上构建的未签名 IPA。需要用免费 Apple ID（Sideloadly / AltStore / SideStore）或自备证书重签后才能安装。" \
            --latest
